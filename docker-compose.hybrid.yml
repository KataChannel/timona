version: '3.8'

# Timona Single Domain Deployment - Optimized for 1-2 Core, 1.5GB RAM, 7GB Storage
# Unified database and services for Timona domain

services:
  # ========================================
  # TIMONA DOMAIN SERVICES (Port 300XX)
  # ========================================
  
  # Redis Cache
  redis:
    image: redis:7.4-alpine
    container_name: timona-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --timeout 300 --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "15004:6379"
    volumes:
      - redis_data:/data
    networks:
      - timona-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # Minio Object Storage
  minio:
    image: minio/minio:RELEASE.2024-08-26T15-33-07Z
    container_name: timona-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio-admin
      MINIO_ROOT_PASSWORD: minio-secret-2025
    ports:
      - "15007:9000"
      - "15008:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - timona-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: timona-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: timonacore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15003:5432"
    volumes:
      - timona_postgres_data:/var/lib/postgresql/data
    networks:
      - timona-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # PgAdmin - Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: timona-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@timona.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "15002:80"
    depends_on:
      - postgres
    networks:
      - timona-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Backend Service
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: timona-backend
    restart: unless-stopped
    env_file:
      - .env.timona
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/timonacore
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_KEY_PREFIX: "timona:"
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: minio-admin
      MINIO_SECRET_KEY: minio-secret-2025
      MINIO_BUCKET_NAME: timona-uploads
      # Support Chat AI Configuration
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY}
    ports:
      - "15001:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - timona-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: timona-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_OTEL_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "15000:3000"
    depends_on:
      - backend
    networks:
      - timona-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  timona_postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  timona-network:
    driver: bridge
    name: timona-network
